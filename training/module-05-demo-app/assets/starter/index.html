<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo App — Generative Model</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    textarea { width: 100%; height: 6rem; }
    pre { background:#f6f8fa; padding:1rem; white-space:pre-wrap }
  </style>
</head>
<body>
  <h1>Generative Model — Minimal Demo</h1>
  <p>Type a prompt and click Generate. This frontend calls <code>/api/generate</code> on the same origin.</p>
  <textarea id="prompt" placeholder="Enter prompt...">Give a short friendly greeting for a new user.</textarea>
  <div style="margin-top:.5rem">
    <button id="submit">Generate</button>
  </div>

  <h2>Result</h2>
  <div id="status"></div>
  <pre id="result"></pre>

  <script>
    const submit = document.getElementById('submit');
    const promptEl = document.getElementById('prompt');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    submit.addEventListener('click', async () => {
      const prompt = promptEl.value.trim();
      if (!prompt) return alert('Please enter a prompt');
      statusEl.textContent = 'Sending...';
      resultEl.textContent = '';
      try {
        const resp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await resp.json();
        if (!resp.ok) {
          statusEl.textContent = 'Error: ' + (data.error || resp.statusText);
          return;
        }
        statusEl.textContent = 'OK';
        resultEl.textContent = data.text || JSON.stringify(data, null, 2);
      } catch (err) {
        statusEl.textContent = 'Network error';
        resultEl.textContent = String(err);
      }
    });
  </script>
</body>
</html>
